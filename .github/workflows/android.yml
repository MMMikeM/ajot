name: Android

# Builds the Android app for the server in the AJOT_SERVER_URL repo variable, signed with the
# ANDROID_KEYSTORE_BASE64 secret (a PKCS12 keystore, key alias "ajot"). A push keeps the APK as the
# run's artifact; a release (release.yml) attaches it to its tag's release, where Obtainium finds it.
on:
  push:
    # Branches only: a tag builds through release.yml
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Android refuses an update whose versionCode isn't higher, so it grows with the version
      - name: Version
        id: version
        run: |
          version=$(jq -r .version packages/client/package.json)
          IFS=. read -r major minor patch <<< "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # No wrapper is committed: its jar is a binary nobody here builds
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.9.0
          # Saved only from the default branch otherwise
          cache-read-only: false

      # Opens the keystore first, so a bad secret fails here rather than after the build
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/release.p12" -storepass "$ANDROID_KEYSTORE_PASSWORD"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          AJOT_SERVER_URL: ${{ vars.AJOT_SERVER_URL || 'https://ajot.fly.dev' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ajot-$VERSION_NAME.apk"

      # A server serves this fingerprint in its assetlinks.json; a mismatch only shows on the phone,
      # as the app's URL bar
      - name: Signing fingerprint
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs ajot-*.apk | grep SHA-256 | tee -a "$GITHUB_STEP_SUMMARY"

      - if: ${{ !inputs.tag }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ajot-android
          path: ajot-*.apk

      # One APK per release, which Obtainium needs to update in the background
      - if: ${{ inputs.tag }}
        name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" ajot-*.apk
