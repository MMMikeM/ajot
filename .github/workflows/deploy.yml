name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build
        run: |
          ARGS="--build-arg SERVER_URL=https://extension-sync-service.fly.dev \
                --build-arg VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}"

          # Export extension artifact — builds client stage, Vite runs once
          docker buildx build --target extension --output type=local,dest=./extension $ARGS .

          # Build production image — all client layers already cached
          docker build -t hearth $ARGS .

      - run: flyctl deploy --image hearth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/
