name: Deploy

on:
  push:
    branches: [main]
  # A pull request runs the unit tests and the builds; the e2e suites wait for main, which still
  # deploys only once they pass. Run this by hand to put a branch through them before merging.
  pull_request:
  workflow_dispatch:

# Actions are pinned to commits, so a moved tag can't run new code next to the secrets, and the
# token only reads the repo
permissions:
  contents: read

# On main, jobs cancel their own older copies: cancelling a run could stop a deploy halfway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  # The client and extensions, built once: every e2e job tests this build and the deploy ships it
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # GitHub lists every commit author and Co-authored-by as a contributor, and a contributor
      # stays listed even after the commits are rewritten
      - name: Only Mike's commits
        run: |
          others=$(git log --format='%an' | sort -u | grep -vx 'Mike Murray' || true)
          coauthors=$(git log --format='%(trailers:key=Co-authored-by,valueonly)' | grep . | sort -u || true)
          if [ -n "$others$coauthors" ]; then
            echo "::error::Commits by someone else: $others $coauthors"
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Builds the client first
      - run: pnpm build:ext

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-build
          path: |
            packages/client/dist
            packages/client/dist-extension
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: build
    if: github.event_name != 'pull_request'
    # This image ships Google Chrome, so Chromium's libraries are already there; the suite starts
    # its own database in the runner's Docker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: shard-1, run: pnpm exec playwright test --shard=1/6 }
          - { name: shard-2, run: pnpm exec playwright test --shard=2/6 }
          - { name: shard-3, run: pnpm exec playwright test --shard=3/6 }
          - { name: shard-4, run: pnpm exec playwright test --shard=4/6 }
          - { name: shard-5, run: pnpm exec playwright test --shard=5/6 }
          - { name: shard-6, run: pnpm exec playwright test --shard=6/6 }
          # The specs that need a production build (the prerendered skeleton, a stale chunk, load
          # timing), then the extension's background and the PWA's worker saving the lists
          - name: builds
            run: pnpm exec playwright test -c playwright.prerender.config.ts && pnpm exec playwright test -c playwright.background.config.ts
    name: e2e (${{ matrix.name }})
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-build
          path: packages/client

      # Without --with-deps: the runner already has Chromium's libraries, and the fonts and virtual
      # display it adds took 7 minutes when Ubuntu's mirror was slow
      - run: pnpm --filter @newtab-todo/e2e exec playwright install chromium

      # Playwright itself rather than `pnpm test:e2e`, whose task would build the client again
      - run: ${{ matrix.run }}
        working-directory: packages/e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: packages/e2e/.report
          # Dot folders are skipped by default, which left the upload empty
          include-hidden-files: true

  # The server image, built while the tests run; the deploy adds the tested client to it. Pull
  # requests build it too, so a broken Dockerfile shows before the merge.
  server-image:
    runs-on: ubuntu-26.04
    concurrency:
      group: server-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # master as of 2026-04-08: the last release, 1.5 from 2024, still runs on Node 20
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Builds on the runner's own Docker, uncached: restoring layers from the GitHub Actions cache
      # was slower, as the node_modules layers run to 200+ MB each
      - run: |
          docker build --target server -t registry.fly.io/ajot:server-${{ github.sha }} .
          docker push registry.fly.io/ajot:server-${{ github.sha }}

  # An older run can pass its tests before a newer one starts its own
  latest:
    needs: [e2e, server-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    outputs:
      is-head: ${{ steps.head.outputs.is-head }}
    steps:
      - id: head
        run: |
          head=$(curl -sf -H "Accept: application/vnd.github.sha" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main") || head=${{ github.sha }}
          echo "is-head=$([ "$head" = "${{ github.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: latest
    if: needs.latest.outputs.is-head == 'true'
    runs-on: ubuntu-26.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Once every suite has passed. A migration that fails rolls back and stops the deploy.
      - name: Migrate the database
        run: pnpm --filter @newtab-todo/server db:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # master as of 2026-04-08: the last release, 1.5 from 2024, still runs on Node 20
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      # The image copies the client from here; the zips below are the extensions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-build
          path: packages/client

      # So the build can pull the server image
      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy --local-only --build-arg SERVER_IMAGE=registry.fly.io/ajot:server-${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify clients of deploy
        run: |
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_PUSH_SECRET }}" \
            https://ajot.fly.dev/api/deploy/notify
        continue-on-error: true

      # Zips the stores take as they are: manifest.json at the root, plus the source archive AMO
      # asks for because the code is bundled
      - name: Package for the stores
        run: |
          version=$(jq -r .version packages/client/package.json)
          (cd packages/client/dist-extension/firefox && zip -r -X -q "$OLDPWD/ajot-$version-firefox.zip" .)
          (cd packages/client/dist-extension/chrome && zip -r -X -q "$OLDPWD/ajot-$version-chrome.zip" .)
          git archive --format=zip -o "ajot-$version-source.zip" HEAD

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ajot-*-firefox.zip
          archive: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ajot-*-chrome.zip
          archive: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ajot-*-source.zip
          archive: false
