name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: >
          flyctl deploy --local-only
          --build-arg SERVER_URL=
          --build-arg VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Extract extension artifact
        run: |
          docker build --target build -t hearth-build \
            --build-arg SERVER_URL=https://extension-sync-service.fly.dev \
            --build-arg VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }} \
            .
          id=$(docker create hearth-build)
          docker cp "$id:/app/dist/extension" ./extension
          docker rm "$id"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/
