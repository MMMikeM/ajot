name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: >
          flyctl deploy --local-only
          --build-arg TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }}
          --build-arg TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
          --build-arg VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          --build-arg VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          --build-arg VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          --build-arg VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Extract extension artifact
        run: |
          img=$(docker images --filter "reference=registry.fly.io/*" -q | head -1)
          [ -z "$img" ] && img=$(docker images -q | head -1)
          id=$(docker create "$img")
          docker cp "$id:/app/.output/extension" ./extension
          docker rm "$id"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/
