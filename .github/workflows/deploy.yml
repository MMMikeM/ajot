name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Extract extension artifact
        run: |
          docker buildx build --target extension --output type=local,dest=./extension .

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @newtab-todo/server...

      # Without a TTY, a rename or data-loss change exits 2 and stops the deploy; push those by hand.
      - name: Push database schema
        run: pnpm --filter @newtab-todo/server db:push --verbose
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify clients of deploy
        run: |
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_PUSH_SECRET }}" \
            https://extension-sync-service.fly.dev/api/deploy/notify
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension/
