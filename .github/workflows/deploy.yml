name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Every build below runs on the runner's own Docker, so each reuses the layers the ones
      # before it built. (Restoring layers from the GitHub Actions cache instead was slower:
      # the node_modules layers run to 200+ MB each.)
      - name: Build the extensions
        run: >
          docker buildx build --target extension --build-arg GITHUB_SHA
          --output type=local,dest=extension .

      - name: Push database schema
        run: >
          docker buildx build --target schema --no-cache-filter schema
          --secret id=TURSO_DATABASE_URL,env=TURSO_DATABASE_URL
          --secret id=TURSO_AUTH_TOKEN,env=TURSO_AUTH_TOKEN
          --output type=cacheonly .
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - run: flyctl deploy --local-only --build-arg GITHUB_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify clients of deploy
        run: |
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_PUSH_SECRET }}" \
            https://extension-sync-service.fly.dev/api/deploy/notify
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension/
