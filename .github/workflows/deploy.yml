name: Deploy

on:
  push:
    branches: [main]
  # A pull request runs the e2e job only; deploying stays with pushes to main
  pull_request:

jobs:
  e2e:
    # Playwright's --with-deps knows this release's packages; the suite starts its own database
    # in the runner's Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @newtab-todo/e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # The specs that need a production build: the prerendered skeleton, a stale chunk, load timing
      - run: pnpm test:e2e:prerender

      # The extension's background and the PWA's worker, saving the lists for flight mode
      - run: pnpm test:e2e:background

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/.report
          # Dot folders are skipped by default, which left the upload empty
          include-hidden-files: true

  deploy:
    needs: e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Every build below runs on the runner's own Docker, so each reuses the layers the ones
      # before it built. (Restoring layers from the GitHub Actions cache instead was slower:
      # the node_modules layers run to 200+ MB each.)
      - name: Build the extensions
        run: >
          docker buildx build --target extension --build-arg GITHUB_SHA
          --output type=local,dest=extension .

      - name: Push database schema
        run: >
          docker buildx build --target schema --no-cache-filter schema
          --secret id=TURSO_DATABASE_URL,env=TURSO_DATABASE_URL
          --secret id=TURSO_AUTH_TOKEN,env=TURSO_AUTH_TOKEN
          --output type=cacheonly .
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - run: flyctl deploy --local-only --build-arg GITHUB_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify clients of deploy
        run: |
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_PUSH_SECRET }}" \
            https://ajot.fly.dev/api/deploy/notify
        continue-on-error: true

      # Zips the stores take as they are: manifest.json at the root, plus the source archive AMO
      # asks for because the code is bundled
      - name: Package for the stores
        run: |
          version=$(jq -r .version packages/client/package.json)
          (cd extension/firefox && zip -r -X -q "$OLDPWD/ajot-$version-firefox.zip" .)
          (cd extension/chrome && zip -r -X -q "$OLDPWD/ajot-$version-chrome.zip" .)
          git archive --format=zip -o "ajot-$version-source.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          path: ajot-*-firefox.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ajot-*-chrome.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ajot-*-source.zip
          archive: false
