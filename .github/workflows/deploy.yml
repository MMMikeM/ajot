name: Deploy

on:
  push:
    branches: [main]
  # A pull request runs the tests and builds the server image; deploying stays with pushes to main
  pull_request:

jobs:
  e2e:
    # This image ships Google Chrome, so Chromium's libraries are already there; the suite starts
    # its own database in the runner's Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # GitHub lists every commit author and Co-authored-by as a contributor, and a contributor
      # stays listed even after the commits are rewritten
      - name: Only Mike's commits
        run: |
          others=$(git log --format='%an' | sort -u | grep -vx 'Mike Murray' || true)
          coauthors=$(git log --format='%(trailers:key=Co-authored-by,valueonly)' | grep . | sort -u || true)
          if [ -n "$others$coauthors" ]; then
            echo "::error::Commits by someone else: $others $coauthors"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Without --with-deps: the runner already has Chromium's libraries, and the fonts and virtual
      # display it adds took 7 minutes when Ubuntu's mirror was slow
      - run: pnpm --filter @newtab-todo/e2e exec playwright install chromium

      - run: pnpm test:e2e

      # The specs that need a production build: the prerendered skeleton, a stale chunk, load timing
      - run: pnpm test:e2e:prerender

      # The extension's background and the PWA's worker, saving the lists for flight mode
      - run: pnpm test:e2e:background

      # Once the suites pass, and only for a deploy, with the dependencies installed above. A
      # migration that fails rolls back and stops the deploy.
      - name: Migrate the database
        if: github.event_name == 'push'
        run: pnpm --filter @newtab-todo/server db:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # The deploy ships the build these tests ran against rather than building it again
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: client-build
          path: |
            packages/client/dist
            packages/client/dist-extension
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/.report
          # Dot folders are skipped by default, which left the upload empty
          include-hidden-files: true

  # The server image, built while the tests run; the deploy adds the tested client to it. Pull
  # requests build it too, so a broken Dockerfile shows before the merge.
  server-image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Builds on the runner's own Docker, uncached: restoring layers from the GitHub Actions cache
      # was slower, as the node_modules layers run to 200+ MB each
      - run: |
          docker build --target server -t registry.fly.io/ajot:server-${{ github.sha }} .
          docker push registry.fly.io/ajot:server-${{ github.sha }}

  deploy:
    needs: [e2e, server-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The image copies the client from here; the zips below are the extensions
      - uses: actions/download-artifact@v8
        with:
          name: client-build
          path: packages/client

      # So the build can pull the server image
      - run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - run: flyctl deploy --local-only --build-arg SERVER_IMAGE=registry.fly.io/ajot:server-${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify clients of deploy
        run: |
          curl -sf -X POST \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_PUSH_SECRET }}" \
            https://ajot.fly.dev/api/deploy/notify
        continue-on-error: true

      # Zips the stores take as they are: manifest.json at the root, plus the source archive AMO
      # asks for because the code is bundled
      - name: Package for the stores
        run: |
          version=$(jq -r .version packages/client/package.json)
          (cd packages/client/dist-extension/firefox && zip -r -X -q "$OLDPWD/ajot-$version-firefox.zip" .)
          (cd packages/client/dist-extension/chrome && zip -r -X -q "$OLDPWD/ajot-$version-chrome.zip" .)
          git archive --format=zip -o "ajot-$version-source.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          path: ajot-*-firefox.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ajot-*-chrome.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ajot-*-source.zip
          archive: false
