app = 'ajot'
primary_region = 'ams'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
timeout = "5s"
path = "/health"

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[env]
ANDROID_PACKAGE_NAME = 'app.ajot.poc'
ANDROID_SHA256_FINGERPRINTS = 'FA:C3:F1:A3:7C:67:4A:08:8D:16:A2:74:93:A0:E4:82:8B:DF:91:98:DA:01:62:FF:A6:7E:67:29:F4:BE:02:B8'
