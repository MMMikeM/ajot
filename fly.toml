app = 'ajot'
primary_region = 'ams'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
timeout = "5s"
path = "/health"

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1

[env]
ANDROID_PACKAGE_NAME = 'app.ajot'
ANDROID_SHA256_FINGERPRINTS = 'BA:03:17:E8:75:F9:B3:C5:CC:88:D4:4F:63:70:4B:EA:59:93:C1:7B:C3:B1:5B:4F:B2:84:29:18:88:71:17:AF'
