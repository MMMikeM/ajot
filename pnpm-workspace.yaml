packages:
  - "packages/*"

allowBuilds:
  "@journeyapps/wa-sqlite": true
  esbuild: true
  msw: true
overrides:
  serialize-javascript@<7.0.5: ">=7.0.5"
  serialize-javascript@<=7.0.2: ">=7.0.3"
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
