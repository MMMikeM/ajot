packages:
  - "packages/*"

allowBuilds:
  # Only checks for its prebuilt binary; dependency-cruiser parses TS through it
  "@swc/core": false
  esbuild: true
  msw: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
minimumReleaseAgeExclude:
  - "@mmmike/web-push@1.5.0"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
